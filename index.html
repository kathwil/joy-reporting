<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JOY · Reports</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#152a40; --muted:#5b6b7d; --line:#dde3e8; --bg:#e8eaec; --card:#ffffff;
    --accent:#f0d57b; --accent-ink:#233f60;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{
    font-family:'Montserrat', system-ui, -apple-system, sans-serif;
    background:var(--bg); color:var(--ink);
  }
  #shell-header{
    background:var(--ink); border-bottom:1px solid var(--ink);
    padding:0 20px; position:sticky; top:0; z-index:40;
  }
  #shell-header-inner{
    max-width:1160px; margin:0 auto; display:flex; align-items:center;
    gap:28px; height:60px;
  }
  .brand{display:flex; align-items:center; gap:10px; font-weight:600; font-size:15px; color:#fff;}
  .brand-mark{
    width:26px; height:26px; border-radius:7px; background:var(--accent); color:var(--ink);
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; letter-spacing:.02em;
  }
  #tabs{display:flex; gap:4px; margin-left:auto;}
  #tabs button{
    border:0; background:transparent; padding:9px 16px; font-size:13.5px; font-weight:500;
    color:rgba(255,255,255,.65); cursor:pointer; border-radius:8px; font-family:inherit;
    transition:background .15s, color .15s;
  }
  #tabs button:hover{background:rgba(255,255,255,.08); color:#fff;}
  #tabs button.active{background:var(--accent); color:var(--ink);}
  .view{display:none;}
  .view.active{display:block;}
  #boot-msg{
    max-width:1160px; margin:60px auto; padding:0 20px; color:var(--muted); font-size:14px;
  }
</style>
</head>
<body>

<div id="shell-header">
  <div id="shell-header-inner">
    <div class="brand">JOY Reports</div>
    <div id="tabs">
      <button id="tab-anmeldung" class="active">Anmeldeverhalten</button>
      <button id="tab-feedback">Feedback</button>
    </div>
  </div>
</div>

<div id="boot-msg">Lädt …</div>

<div id="view-anmeldung" class="view active"><div id="root-dashboard"></div></div>
<div id="view-feedback" class="view"><div id="root-berichte"></div></div>

<!-- React -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<!-- Recharts (UMD) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js" crossorigin></script>
<script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js" crossorigin></script>
<!-- Babel standalone (in-browser JSX transform) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.25.6/babel.min.js" crossorigin></script>

<script type="text/babel" data-presets="react" src="./dashboard.js"></script>
<script type="text/babel" data-presets="react" src="./berichte.js"></script>

<script>
  (function(){
    var tabAnmeldung = document.getElementById("tab-anmeldung");
    var tabFeedback  = document.getElementById("tab-feedback");
    var viewAnmeldung = document.getElementById("view-anmeldung");
    var viewFeedback  = document.getElementById("view-feedback");
    var bootMsg = document.getElementById("boot-msg");

    var mounted = { anmeldung: false, feedback: false };

    function fail(where, err){
      bootMsg.style.display = "block";
      bootMsg.textContent = "Fehler beim Laden (" + where + "): " + (err && err.message ? err.message : err);
      if (window.console) console.error(err);
    }

    function mount(which){
      if (mounted[which]) return true;
      var Comp = which === "anmeldung" ? window.JOYDashboard : window.BerichteApp;
      if (typeof Comp !== "function") return false;
      try {
        ReactDOM.createRoot(
          document.getElementById(which === "anmeldung" ? "root-dashboard" : "root-berichte")
        ).render(React.createElement(Comp));
        mounted[which] = true;
        return true;
      } catch (err) { fail(which, err); return true; }
    }

    function showTab(name){
      var isAnmeldung = name === "anmeldung";
      tabAnmeldung.classList.toggle("active", isAnmeldung);
      tabFeedback.classList.toggle("active", !isAnmeldung);
      viewAnmeldung.classList.toggle("active", isAnmeldung);
      viewFeedback.classList.toggle("active", !isAnmeldung);
      mount(name);
    }
    tabAnmeldung.addEventListener("click", function(){ showTab("anmeldung"); });
    tabFeedback.addEventListener("click", function(){ showTab("feedback"); });

    // Babel transpiles the external scripts asynchronously, so the components may
    // appear well after window.load. Poll until the first one is ready.
    var waited = 0;
    (function waitForApp(){
      if (mount("anmeldung")) { bootMsg.style.display = "none"; return; }
      waited += 120;
      if (waited > 30000) { fail("Start", new Error("Skripte konnten nicht geladen werden \u2013 bitte Seite neu laden.")); return; }
      setTimeout(waitForApp, 120);
    })();
  })();
</script>
</body>
</html>
